name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev bpftool iproute2 iputils-ping

      - name: Build
        run: zig build

      - name: E2E (load, attach, count packets)
        id: e2e
        run: |
          set -euxo pipefail

          # bpffs (GitHub-hosted runnerはVMなのでsudoでmountできる)
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf

          # ローダでプログラムをロード (mapとprogramをpinする)
          sudo ./zig-out/bin/zig_bpf_loader ./zig-out/map.clang.o 2>&1 | tee loader.log
          sudo ls -l /sys/fs/bpf

          # veth ペアを作り、片側にXDPをアタッチ
          sudo ip link add veth0 type veth peer name veth1
          sudo ip addr add 10.0.0.1/24 dev veth0
          sudo ip addr add 10.0.0.2/24 dev veth1
          sudo ip link set veth0 up
          sudo ip link set veth1 up
          sudo bpftool net attach xdpgeneric pinned /sys/fs/bpf/xdp_count dev veth0

          # veth1 から veth0 に向けてパケットを送る (ARP等もXDPに届く)
          timeout 10 ping -c 3 -W 1 -I veth1 10.0.0.1 || true

          # ピンしたMapの中身を確認する
          sudo bpftool map dump pinned /sys/fs/bpf/pkt_count | tee map_dump.log
          count=$(sudo bpftool -j map lookup pinned /sys/fs/bpf/pkt_count key 0 0 0 0 \
            | jq '.value | if type=="array" then (.[0]) else . end')
          echo "pkt_count=$count"
          echo "pkt_count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## E2E result"
            echo "- pkt_count: \`$count\`"
            echo "### Loader log"
            echo '```'
            cat loader.log
            echo '```'
            echo "### bpftool map dump"
            echo '```'
            cat map_dump.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$count" -gt 0

      - name: Cleanup
        if: always()
        run: |
          sudo bpftool net detach xdpgeneric dev veth0 || true
          sudo ip link del veth0 || true
          sudo rm -f /sys/fs/bpf/pkt_count /sys/fs/bpf/xdp_count
